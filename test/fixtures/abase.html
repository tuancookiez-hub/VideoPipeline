<!doctype html>
<html><head><meta charset="utf-8"></head><body style="margin:0;background:#101018">
<script>
const W = 320, H = 180;
const outC = document.createElement('canvas');
outC.width = W; outC.height = H;
const ctx = outC.getContext('2d');
document.body.appendChild(outC);
window.DUR = 1;
window.renderAt = async (t, type = 'image/png', q = .92) => {
  ctx.fillStyle = '#101018';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#48f';
  ctx.fillRect(t * 260, 60, 60, 60);
  return outC.toDataURL(type, q);
};
window.addEventListener('load', () => { window.ready = true; });
</script></body></html>
