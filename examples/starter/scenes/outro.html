<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Made with five skills</title>
<style>
  :root { --paper: #f4ecdc; --ink: #2b2118; --sun: #c8102e; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); }
  .stage { position: relative; width: 100vw; height: 100vh; background: var(--paper); }
  .line {
    position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
    text-align: center; margin: 0; white-space: nowrap;
    font-family: Georgia, 'Times New Roman', serif; font-size: 6vh; color: var(--ink);
    font-weight: normal; opacity: 0;
  }
  .dot {
    position: absolute; left: 50%; top: 66%; width: 1.4vh; height: 1.4vh; margin: -0.7vh 0 0 -0.7vh;
    border-radius: 50%; background: var(--sun); opacity: 0;
  }
</style>
</head>
<body>
<div class="stage">
  <p class="line" id="line">Made with five skills</p>
  <div class="dot" id="dot"></div>
</div>
<script>
  const DUR = 3;
  const clamp = (x) => Math.min(1, Math.max(0, x));
  const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3);
  const $ = (id) => document.getElementById(id);

  window.__meta = { dur: DUR };
  window.__ready = document.fonts ? document.fonts.ready : Promise.resolve();

  // Letter-spacing opens from 0.02em to 0.28em while the line fades in; deterministic from t.
  window.__seek = function (t) {
    const p = easeOut((t - 0.3) / 1.7);
    $('line').style.opacity = clamp((t - 0.3) / 0.6);
    $('line').style.letterSpacing = (0.02 + 0.26 * p) + 'em';
    $('dot').style.opacity = clamp((t - 1.8) / 0.5);
  };

  window.__seek(0);
</script>
</body>
</html>
